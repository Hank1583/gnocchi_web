        overview: "宇宙正以最適合你的節奏推進著一切。停止過度掌控與焦慮，學會放手與順應。當你不再死守舊有模式，驚喜往往隨之而來。",

    // Card Back Image Design SVG Base64 (Standard aesthetic backing)
    const CARD_BACK_SVG = `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="300" height="480" viewBox="0 0 300 480"><rect width="100%" height="100%" fill="%2318132B"/><rect x="12" y="12" width="276" height="456" rx="16" fill="none" stroke="%23E2C285" stroke-opacity="0.3" stroke-width="1.5"/><rect x="20" y="20" width="260" height="440" rx="12" fill="none" stroke="%23E2C285" stroke-opacity="0.15" stroke-width="1" stroke-dasharray="4 4"/><circle cx="150" cy="240" r="70" fill="none" stroke="%23E2C285" stroke-opacity="0.3" stroke-width="1"/><circle cx="150" cy="240" r="50" fill="none" stroke="%23E8B4B8" stroke-opacity="0.2" stroke-width="1"/><polygon points="150,180 162,228 210,240 162,252 150,300 138,252 90,240 138,228" fill="%23E2C285" fill-opacity="0.25"/><circle cx="150" cy="240" r="6" fill="%23E2C285" fill-opacity="0.8"/><g fill="%23E2C285" fill-opacity="0.4"><circle cx="150" cy="60" r="3"/><circle cx="150" cy="420" r="3"/><circle cx="60" cy="240" r="3"/><circle cx="240" cy="240" r="3"/></g></svg>`;

    // Global State Variables
    let currentShuffledCards = [];
    let selectedCardIndex = null;
    let isFlipping = false;

    // Initialize App on DOM Load
    document.addEventListener("DOMContentLoaded", () => {
      initStarfield();
      resetDraw();
      setReadingDate();
    });

    // Set Current Date Display
    function setReadingDate() {
      const today = new Date();
      const dateStr = today.getFullYear() + '.' + String(today.getMonth() + 1).padStart(2, '0') + '.' + String(today.getDate()).padStart(2, '0');
      document.getElementById('readingDate').innerText = dateStr;
    }

    // Initialize Starfield Background Canvas
    function initStarfield() {
      const canvas = document.getElementById('starsCanvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      let width = canvas.width = window.innerWidth;
      let height = canvas.height = window.innerHeight;

      const stars = [];
      const starCount = Math.floor((width * height) / 10000);

      for (let i = 0; i < starCount; i++) {
        stars.push({
          x: Math.random() * width,
          y: Math.random() * height,
          radius: Math.random() * 1.2 + 0.3,
          alpha: Math.random(),
          speed: Math.random() * 0.01 + 0.003
        });
      }

      function animate() {
        ctx.clearRect(0, 0, width, height);
        stars.forEach(s => {
          s.alpha += s.speed;
          if (s.alpha > 1 || s.alpha < 0) s.speed = -s.speed;
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(226, 194, 133, ${Math.max(0, s.alpha * 0.7)})`;
          ctx.fill();
        });
        requestAnimationFrame(animate);
      }

      animate();

      window.addEventListener('resize', () => {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      });
    }

    // Reset or Shuffle Deck logic
    function resetDraw() {
      isFlipping = false;
      selectedCardIndex = null;

      // Hide Result Section & Show Deck
      const resultSec = document.getElementById('resultSection');
      const deckSec = document.getElementById('deckSection');
      
      resultSec.classList.add('hidden', 'opacity-0', 'translate-y-8');
      deckSec.classList.remove('hidden', 'opacity-0');

      // Shuffle duplicate array of custom cards
      currentShuffledCards = [...CUSTOM_CARDS].sort(() => Math.random() - 0.5);

      renderDeck();
    }

    // Custom card-back image (1080 × 1350, 4:5)
    const CARD_BACK_IMAGE = "./image/card-1.png";

    function renderDeck() {
      const grid = document.getElementById('cardsGrid');
      grid.innerHTML = '';

      currentShuffledCards.forEach((card, index) => {
        const cardContainer = document.createElement('div');
        cardContainer.className = 'card-item relative w-full aspect-[4/5] cursor-pointer group perspective-1000 transition-all duration-300 hover:-translate-y-2 animate-float';
        cardContainer.style.animationDelay = `${index * 0.25}s`;
        cardContainer.innerHTML = `
          <div class="w-full h-full relative rounded-xl overflow-hidden">
            <img src="${CARD_BACK_IMAGE}" alt="麵疙瘩狗今日指引牌卡" class="block w-full h-full object-cover rounded-xl" />
          </div>
        `;
        cardContainer.onclick = () => handleCardSelect(index, cardContainer);
        grid.appendChild(cardContainer);
      });
    }

    // Shuffle Animation triggered manually
    function shuffleCardsAnimation() {
      const cards = document.querySelectorAll('#cardsGrid > div');
      cards.forEach((card, idx) => {
        card.style.transform = `scale(0.9) rotate(${ (idx - 2) * 8 }deg)`;
      });

      setTimeout(() => {
        resetDraw();

      }, 400);
    }

    // Handle User Card Selection & Flip Transition
    function handleCardSelect(index, cardElem) {
      if (isFlipping) return;
      isFlipping = true;
      selectedCardIndex = index;

      const selectedCardData = currentShuffledCards[index];

      // Fade out non-selected cards softly
      const allCards = document.querySelectorAll('#cardsGrid > div');
      allCards.forEach((c, idx) => {
        if (idx !== index) {
          c.style.opacity = '0.2';
          c.style.transform = 'scale(0.95)';
        } else {
          c.style.transform = 'scale(1.05) translateY(-10px)';
        }
      });

      // Show flip animation and transition to result view after short delay
      setTimeout(() => {
        revealResultView(selectedCardData);
      }, 600);
    }

    // Reveal Result Screen with 3D Card Flip
    function revealResultView(cardData) {
      const deckSec = document.getElementById('deckSection');
      const resultSec = document.getElementById('resultSection');

      deckSec.classList.add('opacity-0');
      
      setTimeout(() => {
        deckSec.classList.add('hidden');
        resultSec.classList.remove('hidden');

        // Populate card details
        document.getElementById('resultCardImage').src = cardData.imageUrl;
        document.getElementById('cardTitle').innerText = cardData.name;
        document.getElementById('cardKeywords').innerText = `關鍵字：${cardData.keywords}`;
        document.getElementById('cardOverview').innerText = cardData.overview;
        document.getElementById('cardAction').innerText = cardData.action;

        // Trigger smooth entrance
        setTimeout(() => {
          resultSec.classList.remove('opacity-0', 'translate-y-8');
          
          // Trigger 3D Card Flip in Result View
          const card3D = document.getElementById('resultCard3D');
          card3D.classList.add('rotate-y-180');
        }, 50);

      }, 400);
    }

    // Copy Reading Result to Clipboard
    function copyReadingText() {
      if (selectedCardIndex === null) return;
      const card = currentShuffledCards[selectedCardIndex];
      
      const textToCopy = `✦ Petit Tarot 每日心靈指引 ✦\n\n【抽中牌卡】${card.name}\n【核心解讀】${card.overview}\n【感情指引】${card.love}\n【成長成長】${card.growth}\n【今日行動】${card.action}\n\n— 來自 Petit Factory 的靈魂對話`;

      // Copy using document.execCommand for iframe compatibility
      const textarea = document.createElement('textarea');
      textarea.value = textToCopy;
      document.body.appendChild(textarea);
      textarea.select();
      try {
        document.execCommand('copy');
        showToast("牌卡指引內容已複製至剪貼簿 ✨");
      } catch (err) {
        showToast("複製失敗，請手動複製");
      }
      document.body.removeChild(textarea);
    }

    // Export Result as Image Card via html2canvas
    function exportResultImage() {
      showToast("正在生成精美解答圖卡...");
      const target = document.getElementById('captureArea');

      html2canvas(target, {
        backgroundColor: '#0F0C1B',
        scale: 2,
        useCORS: true, // Allows loading external images if CORS enabled
        logging: false
      }).then(canvas => {
        const link = document.createElement('a');
        link.download = `Petit_Tarot_Reading_${Date.now()}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
        showToast("圖卡已成功下載！✦");
      }).catch(err => {
        console.error(err);
        showToast("圖卡生成受限（可能因外部圖片跨域問題）");
      });
    }

    // Toast Notification helper
    function showToast(message) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toastMsg');
      toastMsg.innerText = message;

      toast.classList.remove('opacity-0', '-translate-y-20');
      toast.classList.add('opacity-100', 'translate-y-0');

      setTimeout(() => {
        toast.classList.remove('opacity-100', 'translate-y-0');
        toast.classList.add('opacity-0', '-translate-y-20');
      }, 3000);
    }
  </script>
</body>
</html>
